name: pentalk_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  intl: ^0.19.0

  # 상태 관리
  provider: ^6.1.2

  # 네트워크
  http: ^1.2.2
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3+1
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.1.3

  # 파일/저장
  share_plus: ^10.0.2
  file_picker: ^10.3.10
  path_provider: ^2.1.4
  path: ^1.8.3
  open_file: ^3.3.2

  # 로컬 DB/저장소
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
